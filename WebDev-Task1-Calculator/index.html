
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="calculator">
        <h2>Calculator</h2>

        <div class="display" aria-label="Calculator display">
            <div id="expression">0</div>
            <div id="result" aria-live="polite">0</div>
        </div>

        <div class="buttons">
            <button type="button" data-action="clear" class="special">C</button>
            <button type="button" data-action="backspace" class="special">DEL</button>
            <button type="button" data-operator="/">÷</button>
            <button type="button" data-operator="*">×</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" data-operator="-">−</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" data-operator="+">+</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" data-action="equals" class="equals">=</button>

            <button type="button" data-action="sign">±</button>
            <button type="button" data-number="0">0</button>
            <button type="button" data-number="." class="decimal">.</button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>
    </main>

</body>
</html>
